name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TYPST_VERSION: 0.15.1
  PDF_NAME: inoffizielle-hfu-typst-vorlage.pdf

jobs:
  build:
    name: Compile and verify PDF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-liberation poppler-utils

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Install Python checks
        run: python3 -m pip install ruff==0.16.8 mypy==2.3.1

      - name: Show tool versions
        run: |
          typst --version
          pdftotext -v 2>&1 | head -n 1
          python3 -m ruff --version
          python3 -m mypy --version

      - name: Check Python code
        run: |
          python3 -m ruff check tests/pruefen.py
          python3 -m ruff format --check tests/pruefen.py
          python3 -m mypy --strict tests/pruefen.py

      - name: Compile and verify template
        run: python3 tests/pruefen.py

      - name: Prepare PDF artifact
        run: cp thesis.pdf "$PDF_NAME"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-template-${{ github.sha }}
          path: ${{ env.PDF_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified PDF
        uses: actions/download-artifact@v4
        with:
          name: rendered-template-${{ github.sha }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PDF_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PDF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
